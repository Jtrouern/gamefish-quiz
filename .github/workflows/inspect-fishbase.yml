name: Inspect FishBase tables
on:
  workflow_dispatch:
  push:
    paths: [scripts/inspect_fishbase.py, .github/workflows/inspect-fishbase.yml]
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install duckdb==1.1.3 huggingface_hub==0.26.2
      - run: mkdir -p data && python scripts/inspect_fishbase.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add data/fishbase_schema.txt
          git commit -m "Update FishBase schema report" || echo "no changes"
          git push
